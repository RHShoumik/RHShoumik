<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ragib Hassan Shoumik, software engineer in Dhaka, Bangladesh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd39a"/>
      <stop offset="1" stop-color="#187258"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd39a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2fd39a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2fd39a" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .role { opacity: 0; animation: cycle 12s infinite; }
      .role:nth-child(2) { animation-delay: 3s; }
      .role:nth-child(3) { animation-delay: 6s; }
      .role:nth-child(4) { animation-delay: 9s; }
      @keyframes cycle { 0%,4% { opacity: 0; transform: translateY(8px); } 8%,22% { opacity: 1; transform: translateY(0); } 26%,100% { opacity: 0; transform: translateY(-8px); } }
      .cursor { animation: blink 1s steps(2) infinite; }
      @keyframes blink { to { opacity: 0; } }
      .orbit { transform-origin: 980px 160px; animation: spin 18s linear infinite; }
      .orbit2 { transform-origin: 980px 160px; animation: spin 28s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .float { animation: bob 5s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-8px); } }
      .wave { animation: drift 10s linear infinite; }
      @keyframes drift { to { transform: translateX(-200px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="980" cy="160" r="220" fill="url(#glow)"/>

    <!-- sea -->
    <g class="wave" fill="none" stroke="#2fd39a" stroke-opacity="0.25" stroke-width="2">
      <path d="M0 290 Q50 275 100 290 T200 290 T300 290 T400 290 T500 290 T600 290 T700 290 T800 290 T900 290 T1000 290 T1100 290 T1200 290 T1300 290 T1400 290"/>
      <path d="M0 305 Q50 295 100 305 T200 305 T300 305 T400 305 T500 305 T600 305 T700 305 T800 305 T900 305 T1000 305 T1100 305 T1200 305 T1300 305 T1400 305" stroke-opacity="0.12"/>
    </g>

    <!-- planet with orbits -->
    <g class="float">
      <circle cx="980" cy="160" r="58" fill="#0f2a20" stroke="url(#jade)" stroke-width="2"/>
      <path d="M940 140 Q980 120 1020 145 Q990 160 960 175 Q1000 180 1030 170" fill="none" stroke="#2fd39a" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="980" cy="160" rx="110" ry="34" fill="none" stroke="#2fd39a" stroke-opacity="0.35" stroke-dasharray="4 6"/>
      <g class="orbit"><circle cx="1090" cy="160" r="6" fill="#2fd39a"/></g>
      <ellipse cx="980" cy="160" rx="160" ry="52" fill="none" stroke="#2fd39a" stroke-opacity="0.18"/>
      <g class="orbit2"><circle cx="820" cy="160" r="4" fill="#9ff0cf"/></g>
    </g>

    <!-- text -->
    <text x="72" y="92" class="t" font-size="20" fill="#2fd39a">// hello, world — I'm</text>
    <text x="72" y="150" class="s" font-size="54" font-weight="800" fill="#f3f7f5" letter-spacing="-1">Ragib Hassan Shoumik</text>
    <g class="t" font-size="24" fill="#9ff0cf">
      <text x="72" y="200" class="role">Software Engineer · Dhaka, Bangladesh</text>
      <text x="72" y="200" class="role">React &amp; Next.js front-end engineer</text>
      <text x="72" y="200" class="role">Building 3D web experiences with Three.js</text>
      <text x="72" y="200" class="role">Open to interesting problems</text>
    </g>
    <rect class="cursor" x="72" y="214" width="14" height="4" fill="#2fd39a"/>
    <text x="72" y="256" class="s" font-size="16" fill="#8fa39a">rhshoumik.dev  ·  @RHShoumik</text>
  </g>
</svg>
